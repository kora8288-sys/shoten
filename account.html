<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Account — MENTALITI / shutter kif.</title>
<meta name="theme-color" content="#000000" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='20' font-style='italic' text-anchor='middle' fill='%23000'%3Ek%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/shop.css" />
<link rel="stylesheet" href="css/account.css" />
</head>
<body class="is-lit">
<div class="ctl">
<button class="ctl__b" id="invertToggle" aria-pressed="false">invert</button>
</div>
<a class="backHome" href="shop.html">← shop</a>

<main>
<section class="sec sec--dark acct" id="account">
<div class="acct__wrap">

<div id="authLoading" class="acct__muted">جاري التحقق…</div>

<div id="authForms" hidden>
  <div id="signInPanel">
    <h2 class="acct__h">تسجيل الدخول</h2>
    <form id="signInForm" class="acct__form">
      <input name="email" type="email" placeholder="البريد الإلكتروني" required />
      <input name="password" type="password" placeholder="كلمة السر" required />
      <button type="submit" class="acct__btn">دخول</button>
      <p id="signInError" class="acct__err"></p>
    </form>
    <p class="acct__switch">ما عندك حساب؟ <a href="#" id="showSignUp">سجل واحد جديد</a></p>
  </div>

  <div id="signUpPanel" hidden>
    <h2 class="acct__h">حساب جديد</h2>
    <form id="signUpForm" class="acct__form">
      <input name="email" type="email" placeholder="البريد الإلكتروني" required />
      <input name="password" type="password" placeholder="كلمة السر (6 أحرف عالأقل)" required minlength="6" />
      <button type="submit" class="acct__btn">إنشاء حساب</button>
      <p id="signUpError" class="acct__err"></p>
    </form>
    <p class="acct__switch">عندك حساب أصلًا؟ <a href="#" id="showSignIn">سجل دخولك</a></p>
  </div>
</div>

<div id="loggedIn" hidden>
  <h2 class="acct__h">أهلًا، <span id="userEmail"></span></h2>
  <button id="signOutBtn" class="acct__btn acct__btn--ghost">تسجيل خروج</button>
  <h3 class="acct__h acct__h--sm">طلباتي</h3>
  <div id="ordersList"></div>
</div>

</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/account.js"></script>
</body>
</html>
